services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /srv/services/homarr/configs:/app/data/configs
      - /srv/services/homarr/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - services
    env_file: ./.env

networks:
  services:
    external: true
