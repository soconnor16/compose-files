services:
  netdata:
    image: netdata/netdata:latest
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/services/netdata/config:/etc/netdata
      - /srv/services/netdata/data:/var/lib/netdata
    networks:
      - services

networks:
  services:
    external: true
