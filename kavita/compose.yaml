services:
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago 
    volumes:
      - /home/srv/services/kavita/config:/config
      - /home/srv/services/paperless-ngx/media/documents/originals:/data:ro
    ports:
      - 5000:5000
    restart: unless-stopped
